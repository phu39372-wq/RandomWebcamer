name: Build unsigned IPA (sign locally with Sideloadly)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Inject API key into Config.xcconfig
        env:
          WINDY_API_KEY: ${{ secrets.WINDY_API_KEY }}
        run: |
          echo "WINDY_API_KEY = $WINDY_API_KEY" > Config.xcconfig

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for device (unsigned)
        run: |
          xcodebuild build \
            -project RandomWebcam.xcodeproj \
            -scheme RandomWebcam \
            -sdk iphoneos \
            -configuration Debug \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES

      - name: Package into unsigned .ipa
        run: |
          cd build/Build/Products/Debug-iphoneos
          mkdir -p Payload
          cp -R RandomWebcam.app Payload/
          zip -r RandomWebcam.ipa Payload
          ls -la

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RandomWebcam-ipa
          path: build/Build/Products/Debug-iphoneos/RandomWebcam.ipa
