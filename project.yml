name: RandomWebcam
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"

configs:
  Debug: debug
  Release: release

targets:
  RandomWebcam:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.randomwebcam
        SWIFT_VERSION: 5.0
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_FILE: Sources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
      configs:
        Debug:
          CODE_SIGNING_ALLOWED: NO
        Release:
          CODE_SIGNING_ALLOWED: NO
    configFiles:
      Debug: Config.xcconfig
      Release: Config.xcconfig
